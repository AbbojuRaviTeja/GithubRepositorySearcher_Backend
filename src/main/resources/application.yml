server:
  port: 8080

spring:
  application:
    name: github-searcher
  config:
    # Local secrets live in .env (gitignored). Missing file is fine; OS env vars still work.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:github_searcher}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Keep trying the first connection so the app can outlast a slow Postgres start.
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

github:
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    connect-timeout: ${GITHUB_CONNECT_TIMEOUT:5s}
    read-timeout: ${GITHUB_READ_TIMEOUT:10s}
    per-page: ${GITHUB_PER_PAGE:30}
    # Hard-capped at 10 in the client. Default 1 keeps a single user request to one GitHub call.
    max-pages: ${GITHUB_MAX_PAGES:1}
    fetch-all-pages: ${GITHUB_FETCH_ALL_PAGES:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.githubsearcher: INFO
